[project]
name = "catchthatbird"
version = "0.3.0"
description = "Passive bird-visit logger for a parked car (DJI Pocket 3 webcam + MOG2 + YOLOv8n)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]            # the project root is the import root
addopts = "--strict-markers -p no:cacheprovider"
markers = [
    "slow: loads the real yolov8n.pt (three tests; excluded in CI with -m \"not slow\")",
]

[tool.coverage.run]
# Application modules only (tests excluded by construction, on every OS).
source = ["camera", "config_schema", "detector", "logger", "main", "obs", "scripts"]
patch = ["subprocess"]        # measure main.py runs started with subprocess too
